[workspace]
resolver = "3"
members = [
    "crates/epsilon-contracts",
    "crates/epsilon-llm",
    "crates/epsilon-session",
    "crates/epsilon-core",
    "crates/epsilon-tools",
    "crates/epsilon-safety",
    "crates/epsilon-ext",
    "crates/epsilon-mcp",
    "crates/epsilon-lsp",
    "crates/epsilon-runtime",
    "crates/epsilon-tui",
    "crates/epsilon-server",
    "crates/epsilon-cli",
    "crates/epsilon-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Mohamed"]

# Dependency policy (ADR-016): direct external dependencies are pinned to exact
# versions ("=x.y.z") in [workspace.dependencies] as they are introduced.
[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
async-trait = "=0.1.89"
tokio = { version = "=1.53.1", features = ["sync", "time", "macros", "rt", "fs", "process", "io-util", "io-std"] }
tokio-util = "=0.7.19"
futures-util = "=0.3.31"
# M17 (pi port): direct per-provider HTTP transport replaces genai. reqwest was already
# in-tree via rmcp; pinned exact per ADR-016.
# `rustls` enables TLS for https (default-tls) — without it every https request
# fails with "no TLS backend" / network error (root cause of blank replies).
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
# M196: the TLS crypto provider is `ring`, not `aws-lc-rs`.
#
# `reqwest`'s `rustls` feature pulls in `aws-lc-rs`, which compiles the BoringSSL
# fork in C. That needs a working MSVC toolchain, NASM and CMake+MSBuild, and
# where they are missing it fails as `failed to run custom build command for
# aws-lc-sys` -- naming a dependency rather than the missing tools, which cost a
# full session to find. `ring` is a Rust build with no assembly step, so it
# removes the whole class of failure instead of working around it.
#
# The cost is real and worth stating plainly: `ring` does not implement P-521,
# so a server presenting a P-521-only chain cannot be verified. The trade is
# deliberate: "builds anywhere a Rust toolchain exists" beats "builds only where
# a C toolchain and NASM happen to be installed".
#
# `rustls-no-provider` is the half that needs a companion line: it enables rustls
# with NO default provider, so `ring` must be installed before the first client
# is built (see `epsilon_llm::http::http_client`).
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Already in the tree via reqwest (same 1.12.1 in Cargo.lock — declaring it adds no new
# compilation, it only makes the type nameable). Needed because M137's F03 fix turns
# `WireStream`'s body into a boxed `Stream`, whose item type is `bytes::Bytes`, and
# Rust will not let a crate name a transitive dependency. See the ADR-017 amendment.
bytes = "=1.12.1"
tempfile = "=3.23.0"
regex = "=1.13.1"
schemars = { version = "=1.2.2", features = ["derive"] }
ratatui = "=0.30.2"
crossterm = { version = "=0.29.0", features = ["event-stream"] }
axum = "=0.8.9"
rmcp = { version = "=3.1.4", default-features = false, features = ["base64", "macros", "client", "transport-child-process"] }

# Test-only: the terminal integration test drives the *built binary* through a
# real pseudo-console. `portable-pty` is the platform's own pty (ConPTY on
# Windows, openpty elsewhere), and `vt100` interprets what comes back so the test
# can assert on the screen rather than on a byte stream. Both are dev-dependencies
# of `epsilon-cli` and nowhere else — no shipping crate links them.
portable-pty = "=0.9.0"
vt100 = "=0.15.2"

# Windows Job Object confinement (M10, ADR-005). Already in the tree via crossterm;
# pinned exact per supply-chain policy.
winapi = { version = "=0.3.9", features = ["jobapi2", "processthreadsapi", "handleapi", "winnt", "impl-default"] }
arboard = "=3.6.1"
toml = "=1.1.4"
sha2 = "=0.11.0"
pulldown-cmark = "=0.13.4"
# M16a: display-width math for the transcript wrap + footer (CJK/emoji columns).
# Already in-tree transitively via ratatui-core's `>=0.2.0` requirement; pinned exact.
unicode-width = "=0.2.2"
# M36: grapheme-cluster editing (pi `Intl.Segmenter` parity — backspace/delete
# and cursor movement must never split ZWJ/combining sequences).
# Already in-tree transitively (1.13.3 in Cargo.lock); pinned exact.
unicode-segmentation = "=1.13.3"
# M43: image attachments (pi `harness/tools/image.ts` base64). Already in-tree
# transitively (0.23.1 in Cargo.lock via rmcp/reqwest); pinned exact.
base64 = "=0.23.1"
# M52: OAuth login ceremonies need a CSPRNG for the PKCE code verifier
# (RFC 7636 §4.1 requires cryptographic randomness) and for the `state`
# parameter. std has no RNG; hand-rolling one would be worse. Already in-tree
# transitively at this exact version (via tempfile/ring); pinned exact.
getrandom = "=0.3.4"

# ---------------------------------------------------------------------------
# Native desktop IDE (ADR-020)
# ---------------------------------------------------------------------------
#
# egui is the only native, non-webview Rust GUI toolkit that clears every bar
# this project needs at once: it renders natively (winit + wgpu, no embedded
# browser), it is MIT-OR-Apache-2.0 so the workspace licence is unchanged, it
# ships AccessKit in its default features so the app is actually reachable by a
# screen reader, and its dependency tree contains **no `bindgen`, `clang-sys` or
# `embed-resource`** -- which matters on a machine whose documented build
# failures are all `cl.exe` / `c1.dll` / NASM problems.
#
# Pinned exact per ADR-016. `wgpu` is selected over `glow` deliberately: DX12 is
# present on every Windows machine this project supports, so the surface comes up
# on a machine with no usable OpenGL driver, which is a real failure mode for
# `glutin` on Windows.
eframe = "=0.36.2"
egui = "=0.36.2"
egui_extras = { version = "=0.36.2", features = ["syntect"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
strip = "symbols"

