# Drop the relevant block into the harness Cargo.toml.
# Apps depend on `ratatui`. Widget crates should use `ratatui-core` instead.

[package]
edition = "2024"
rust-version = "1.88"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
color-eyre = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
futures = "0.3"
unicode-width = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
