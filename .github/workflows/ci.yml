# Epsilon CI (M13): every gate from AGENTS.md, on the platforms the product ships.
#
# - windows: the full suite runs here — Job Object sandbox tests, TUI reducer tests,
#   everything. This is the primary development platform.
# - linux: closes the "Linux confinement verified" acceptance item — the bwrap
#   integration suite (tests/bwrap_unix.rs) executes against real bubblewrap.
# - macos: portability and installer smoke; macOS has no native shell-confinement
#   backend, so the installer is the part that needs a real host.
# - msrv: the workspace declares rust-version = 1.88; prove every crate still
#   compiles there. (Before ADR-039 the desktop crate was excluded on purpose:
#   it needed 1.95 because egui did. That exclusion left with the crate.)
#
# All tests are offline by design (faux providers); no secrets are needed or used.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-full:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Formatting gate (no diffs tolerated)
        run: cargo fmt --all -- --check

      - name: Clippy gate (zero warnings tolerated)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test suite (includes Windows Job Object confinement tests)
        run: cargo test --workspace

      - name: Real-provider path must compile (M13 lesson)
        run: cargo check -p epsilon-cli --features real

      - name: Wire fixture tests (plan 005 — real feature must be TESTED, not just compiled)
        run: cargo test -p epsilon-llm --features real

      - name: Demo must complete
        run: cargo run -q -p epsilon-cli -- --demo

      # The terminal integration test needs a built binary and a real
      # pseudo-console, so it cannot run from `cargo test` alone. Without this
      # step it is a test nobody runs, which is a test that rots.
      #
      # `--test-threads=1`: each test opens its own console, and serialising them
      # keeps a failure's output attributable to one session.
      - name: Build the binary for the terminal test
        run: cargo build -p epsilon-cli

      - name: Terminal integration test (drives the built binary in a pseudo-console)
        env:
          EPSILON_BIN: target/debug/epsilon.exe
        run: cargo test -p epsilon-cli --test terminal -- --test-threads=1

      - name: Windows installer builds and verifies a binary
        shell: pwsh
        run: |
          .\install.ps1 -NoVerify -Prefix "$env:RUNNER_TEMP\epsilon-install"
          & "$env:RUNNER_TEMP\epsilon-install\bin\epsilon.exe" --version

  linux-confinement:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install bubblewrap (bwrap)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 runners restrict unprivileged user namespaces via AppArmor;
          # bwrap needs them for --unshare-all. Documented runner workaround.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --version

      - name: Linux confinement verification (closes the M10/M13 criterion)
        run: cargo test -p epsilon-safety --test bwrap_unix -- --nocapture

      - name: Full suite on Linux too (portability guard)
        run: cargo test --workspace

      # The pty layer is the one part of this project that is genuinely
      # platform-specific (openpty here, ConPTY on Windows). Running the terminal
      # test on both is what makes "it works on Windows" a claim with evidence.
      - name: Build the binary for the terminal test
        run: cargo build -p epsilon-cli

      - name: Terminal integration test (openpty on Linux)
        env:
          EPSILON_BIN: target/debug/epsilon
        run: cargo test -p epsilon-cli --test terminal -- --test-threads=1

      - name: Linux installer builds and verifies a binary
        run: |
          bash install.sh --no-verify --prefix "$RUNNER_TEMP/epsilon"
          "$RUNNER_TEMP/epsilon/bin/epsilon" --version

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install MSRV toolchain (1.88, from Cargo.toml rust-version)
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Workspace compiles under MSRV
        run: cargo check --workspace
  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Full suite on macOS
        run: cargo test --workspace

      - name: Installer builds and verifies a binary on macOS
        run: |
          bash install.sh --no-verify --prefix "$RUNNER_TEMP/epsilon"
          "$RUNNER_TEMP/epsilon/bin/epsilon" --version
