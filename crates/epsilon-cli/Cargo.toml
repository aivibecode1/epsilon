[package]
name = "epsilon-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "epsilon"
path = "src/main.rs"

[features]
# Real network providers via direct per-provider HTTP (M17 pi port; ADR-003 amendment).
#
# M63: ON by default. Off-by-default meant `cargo install epsilon-cli` produced a
# binary that could not talk to a single real model — the first thing every new
# user tries — while the docs only showed the `--features real` incantation for
# people building from a clone. Keys still come from the environment or the
# stored auth file; the feature only decides whether the network path exists.
# Offline/air-gapped builds: `--no-default-features`.
#
# M52: forward to EVERY crate whose real path the binary depends on. Before
# this, `--features real` lit only epsilon-llm's network layer, so
# `epsilon-core::Agent::try_hot_swap_to_real` compiled to its `false` stub and
# the TUI's "now live on X" hot-swap silently degraded to "restart epsilon"
# (found while wiring OAuth login, which lands on that same path). The
# `REAL_PATH_ENABLED` guard below makes the omission a build error.
default = ["real"]
real = ["epsilon-llm/real", "epsilon-core/real", "epsilon-tui/real"]

[dependencies]
epsilon-contracts = { path = "../epsilon-contracts" }
epsilon-llm = { path = "../epsilon-llm" }
epsilon-core = { path = "../epsilon-core" }
epsilon-tools = { path = "../epsilon-tools" }
epsilon-lsp = { path = "../epsilon-lsp" }
epsilon-safety = { path = "../epsilon-safety" }
epsilon-session = { path = "../epsilon-session" }
epsilon-tui = { path = "../epsilon-tui" }
epsilon-server = { path = "../epsilon-server" }
epsilon-mcp = { path = "../epsilon-mcp" }
epsilon-ext = { path = "../epsilon-ext" }
sha2 = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tempfile = { workspace = true }

# The terminal integration test drives the built binary through a real
# pseudo-console. In-process tests render into a `TestBackend`, which is the right
# tool for what a frame looks like and cannot tell you whether the *binary* puts
# that frame on a terminal — terminal init, raw mode, the alternate screen and the
# event stream are all outside the in-process boundary, and they are where the
# reported Windows freeze lived.
[dev-dependencies]
portable-pty = { workspace = true }
vt100 = { workspace = true }

[lints]
workspace = true






