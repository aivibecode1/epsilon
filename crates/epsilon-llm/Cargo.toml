[package]
name = "epsilon-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
epsilon-contracts = { path = "../epsilon-contracts" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
toml = { workspace = true }
# M49: SigV4 signing for Bedrock (HMAC-SHA256 over the workspace sha2 pin —
# no new `hmac` crate; the three-line construction lives in `auth.rs`).
sha2 = { workspace = true }
# M52: PKCE (base64url challenge) + OAuth `state` randomness.
base64 = { workspace = true }
getrandom = { workspace = true }

reqwest = { workspace = true, optional = true }

[features]
# Real network providers (pi-style direct HTTP adapters). Off by default: the faux
# provider keeps tests offline, deterministic, and free.
real = ["dep:reqwest"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
tempfile = { workspace = true }

[lints]
workspace = true
