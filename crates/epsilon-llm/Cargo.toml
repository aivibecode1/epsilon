[package]
name = "epsilon-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
epsilon-contracts = { path = "../epsilon-contracts" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
# M225: `toml` was here for `config.toml`, which this crate no longer parses —
# the reader is `core::config::custom_providers_in` / `oauth_config_in`, and the rows
# are installed here. `cargo tree -p epsilon-llm -i toml` is the proof it is gone.
# M49: SigV4 signing for Bedrock (HMAC-SHA256 over the workspace sha2 pin —
# no new `hmac` crate; the three-line construction lives in `auth.rs`).
sha2 = { workspace = true }
# M52: PKCE (base64url challenge) + OAuth `state` randomness.
base64 = { workspace = true }
getrandom = { workspace = true }

reqwest = { workspace = true, optional = true }
# M196: named so `http_client` can install the `ring` crypto provider. The build
# uses reqwest's `rustls-no-provider`, which deliberately has no default.
rustls = { workspace = true, optional = true }

[features]
# Real network providers (pi-style direct HTTP adapters). Off by default: the faux
# provider keeps tests offline, deterministic, and free.
real = ["dep:reqwest", "dep:rustls"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
tempfile = { workspace = true }

# `usage_arithmetic` exercises `providers::test_support`, which is behind `real`.
# Without this, `cargo test -p epsilon-llm --no-default-features` fails to COMPILE
# with E0433 rather than skipping — and nothing in the gate battery builds without
# default features, so the breakage was invisible until a per-crate sweep hit it.
#
# `required-features` is the honest expression of the dependency: the test cannot
# exist without the feature. The alternative — a `#[cfg(feature = "real")]` on
# every test fn — compiles but reports success having run nothing, which is worse
# than not compiling.
[[test]]
name = "usage_arithmetic"
required-features = ["real"]

[lints]
workspace = true
