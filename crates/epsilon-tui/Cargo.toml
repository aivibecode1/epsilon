[package]
name = "epsilon-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# M175: `real` is on by default here, for the same reason `epsilon-cli` turns it on by
# default at M63.
#
# It used to be off, and the only thing that turned it on was `epsilon-cli`'s default
# feature — which meant `cargo test --workspace` built the real path (feature unification
# carries `epsilon-tui/real` in from the CLI) while `cargo test -p epsilon-tui` did not.
# Measured, not argued: the workspace run collected 1,298 tests and ran the OAuth adapter
# test; the per-crate run collected 373 instead of 374 and silently skipped it. A crate
# whose own test count depends on which other crates happen to be in the invocation is a
# crate nobody can test honestly, and the test that vanished is the one M165 added after a
# no-op `TuiLoginUi::notify` passed 364/364.
#
# Offline/air-gapped builds of the whole workspace: `--no-default-features`.
default = ["real"]
real = ["epsilon-core/real"]

[dependencies]
epsilon-contracts = { path = "../epsilon-contracts" }
epsilon-core = { path = "../epsilon-core" }
epsilon-llm = { path = "../epsilon-llm" }
epsilon-safety = { path = "../epsilon-safety" }
# M57: session discovery for the `/sessions` browser (`epsilon_session::list_sessions`).
# Downward edge only: session sits beside core, below the frontends.
epsilon-session = { path = "../epsilon-session" }
serde_json = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
arboard = { workspace = true }
# The OSC 52 clipboard sequence (`ESC ] 52 ; c ; <base64> BEL`) — the only copy
# path that survives an SSH hop, where arboard reaches a clipboard nobody is
# looking at. `base64::engine::general_purpose::STANDARD` is the alphabet the
# sequence requires (RFC 4648), and the crate is already in-tree at this exact
# version for M43's image attachments, so this declares a dependency the lock
# file already carries. See `src/clipboard.rs`.
base64 = { workspace = true }
pulldown-cmark = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "rt"] }

[dev-dependencies]
tempfile = { workspace = true }
# M196: the `!` shell-escape tests register a real `BashTool`, because the default
# registry is empty and an empty registry makes `run_local` answer "no tool named
# bash" -- which a test asserting on the notice would happily accept. The test has
# to hold a real tool to be worth anything.
#
# Dev-only on purpose: the shipped TUI reaches the shell through
# `epsilon_core::exec::run_local`, never by naming a tool crate. This edge exists so
# the test can supply the same tool the product would.
epsilon-tools = { path = "../epsilon-tools" }

[lints]
workspace = true

