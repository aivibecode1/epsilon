[package]
name = "epsilon-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
real = ["epsilon-core/real"]

[dependencies]
epsilon-contracts = { path = "../epsilon-contracts" }
epsilon-core = { path = "../epsilon-core" }
epsilon-llm = { path = "../epsilon-llm" }
epsilon-safety = { path = "../epsilon-safety" }
# M57: session discovery for the `/sessions` browser (`epsilon_session::list_sessions`).
# Downward edge only: session sits beside core, below the frontends.
epsilon-session = { path = "../epsilon-session" }
serde_json = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
arboard = { workspace = true }
# The OSC 52 clipboard sequence (`ESC ] 52 ; c ; <base64> BEL`) — the only copy
# path that survives an SSH hop, where arboard reaches a clipboard nobody is
# looking at. `base64::engine::general_purpose::STANDARD` is the alphabet the
# sequence requires (RFC 4648), and the crate is already in-tree at this exact
# version for M43's image attachments, so this declares a dependency the lock
# file already carries. See `src/clipboard.rs`.
base64 = { workspace = true }
pulldown-cmark = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "rt"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

