[package]
name = "epsilon-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
real = ["epsilon-core/real"]

[dependencies]
epsilon-contracts = { path = "../epsilon-contracts" }
epsilon-core = { path = "../epsilon-core" }
epsilon-llm = { path = "../epsilon-llm" }
epsilon-safety = { path = "../epsilon-safety" }
# M57: session discovery for the `/sessions` browser (`epsilon_session::list_sessions`).
# Downward edge only: session sits beside core, below the frontends.
epsilon-session = { path = "../epsilon-session" }
serde_json = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
arboard = { workspace = true }
pulldown-cmark = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "rt"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

