[package]
name = "epsilon-desktop"
version.workspace = true
edition.workspace = true
# The one crate with a higher MSRV than the workspace. egui 0.36 declares
# `rust-version = "1.95"`, and a dependency's floor is the floor for anything that
# links it.
#
# Declared here rather than by raising the workspace value on purpose: the CLI, the
# server and the agent core build on 1.88, and a desktop window is not a reason to
# make a headless build on a CI runner need a newer toolchain. `.github/workflows/ci.yml`
# excludes this crate from the 1.88 job for exactly this reason, and says so.
rust-version = "1.95"
license.workspace = true
authors.workspace = true
description = "Epsilon desktop IDE: a native window onto the same agent loop the CLI drives."

[[bin]]
name = "epsilon-desktop"
path = "src/main.rs"

[features]
# Forwarded exactly as `epsilon-tui` does (M175). Without `real`,
# `Agent::try_hot_swap_to_real` compiles to its `false` stub and the app would
# silently run faux-only while still naming a paid model in its header — the
# lie M233 closed in the TUI. The `REAL_PATH_ENABLED` binding in `lib.rs` makes
# a missed forward a compile error rather than a silent degradation.
default = ["real"]
real = ["epsilon-core/real", "epsilon-runtime/real"]

[dependencies]
epsilon-contracts = { path = "../epsilon-contracts" }
epsilon-core = { path = "../epsilon-core" }
epsilon-llm = { path = "../epsilon-llm" }
# ADR-021: the desktop composes its agent through the same `build_runtime` the
# terminal uses. It is a peer frontend, not a second implementation.
epsilon-runtime = { path = "../epsilon-runtime" }
epsilon-session = { path = "../epsilon-session" }
# `ChannelApprovalUi` is the approvals seam the desktop drives its dialog from: it parks a
# request, hands back a list for a panel to draw, and resolves by id out of order — the
# same type the terminal uses, so a permission behaves identically in both windows.
epsilon-safety = { path = "../epsilon-safety" }
# `Confinement` is a `RunParams` field, so naming it here is unavoidable.
epsilon-tools = { path = "../epsilon-tools" }
# `McpServerConfig` is a `RunParams` field too.
epsilon-mcp = { path = "../epsilon-mcp" }
# The **palette, and the numbers** (ADR-020). `epsilon_tui::Theme` resolves semantic roles
# to colors and the desktop converts them. `epsilon_tui::ui::metrics::Metrics` and
# `epsilon_tui::ui::cost` are plain data with formatting methods, and the window reads the
# same context/cache/cost figures the terminal header does rather than re-deriving them:
# one number, two frontends, instead of two that drift. The desktop still draws no
# terminals and depends on no terminal *behaviour* — everything it borrows is either a
# colour role or a value. If that ever stops being true, the edge is one module.
#
# M290 paid one of those halves. The command registry was the module this comment
# predicted: `src/commands.rs` used to read `parse_command` and `COMMAND_HEADS` through
# `epsilon_tui::picker`, and now reads them from `epsilon_contracts::command` directly
# (`crates/epsilon-contracts/src/command.rs`). What remains here is the palette and the
# metrics — colour roles and numbers, not what a `/word` means.
epsilon-tui = { path = "../epsilon-tui" }
ratatui = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
# The markdown parser the terminal frontend already uses. Only the *drawing* differs
# between the two frontends — `epsilon_tui::markdown` emits ratatui `Line`s coupled to
# a width-aware table layout, which is not portable; the parse is.
pulldown-cmark = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }

[dev-dependencies]
# The end-to-end window tests compose a real agent, which needs a real workspace.
tempfile = { workspace = true }
# **Offscreen rasterisation of a real frame. Test-only, and nothing new reaches the
# product.** All three are already in `Cargo.lock` at exactly these versions, pulled in
# transitively (`image` -> `png`, and `eframe` -> `egui-wgpu` -> `wgpu`), so this adds
# no new crate and no new version to the graph — it names three crates the build already
# links. Dev-dependencies are not linked into `epsilon-desktop`, so the shipped binary is
# byte-identical in shape.
#
# The reason is a gap no test could close from the other side: **no wgpu backend presents
# on this machine**, so every claim about this window's pixels was inferred from egui's
# source and the crate's own coordinates (`audit/evidence/desktop-window-measurement-2026-10-03.md`
# — the content area stayed blank even when filled solid red). An offscreen render needs a
# *device and a texture*, not a *swapchain*, so it takes the path that was never the one
# failing. What it produces is a real image of the real draw output, which is what
# `AGENTS.md` §13 asks for and what nothing in the repository had.
wgpu = "=30.0.1"
egui-wgpu = "=0.36.2"
png = "=0.18.1"

[lints]
workspace = true