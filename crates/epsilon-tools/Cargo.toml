[package]
name = "epsilon-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
epsilon-contracts = { path = "../epsilon-contracts" }
epsilon-core = { path = "../epsilon-core" }
epsilon-safety = { path = "../epsilon-safety" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
regex = { workspace = true }
schemars = { workspace = true }
reqwest = { workspace = true }
# Already in the tree via reqwest (same version in Cargo.lock — declaring it
# adds no new compilation): lets webfetch install the `ring` crypto provider
# before its first client, mirroring epsilon-llm/src/http.rs (M196).
rustls = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tokio-util = { workspace = true }

[lints]
workspace = true
