[package]
name = "epsilon-safety"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
epsilon-contracts = { path = "../epsilon-contracts" }
epsilon-core = { path = "../epsilon-core" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = { workspace = true }
tokio-util = { workspace = true }
epsilon-llm = { path = "../epsilon-llm" }
epsilon-tools = { path = "../epsilon-tools" }

[target.'cfg(windows)'.dependencies]
winapi = { workspace = true }

# AGENTS.md exception: the job-object FFI in sandbox::jobobject is this crate's ONLY
# unsafe user; `unsafe_code` cannot stay "forbid" here because forbid is un-overridable.
# Contained discipline: every unsafe block carries a SAFETY comment (lint below), and no
# new unsafe may appear outside that module.
[lints.rust]
missing_docs = "warn"
unsafe_code = "allow"

[lints.clippy]
all = "warn"
undocumented_unsafe_blocks = "warn"

